name: Build Visible Traders Hotfix

on:
  push:
    branches: [build-visibletraders-1.3.2-fix]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build
        working-directory: visibletraders-hotfix
        run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: visibletraders-1.3.2-cartographer-hotfix
          path: visibletraders-hotfix/build/libs/visibletraders-1.3.2-cartographer-hotfix-1.0.0.jar
