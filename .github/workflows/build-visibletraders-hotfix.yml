name: Build Visible Traders Hotfix

on:
  push:
    branches: [build-visibletraders-1.3.2-fix]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[ci artifact]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build and capture output
        shell: bash
        run: |
          set +e
          cd visibletraders-hotfix
          gradle build --stacktrace > ../visibletraders-build.log 2>&1
          status=$?
          cd ..
          mkdir -p artifacts
          cp visibletraders-build.log artifacts/build.log
          jar_path="visibletraders-hotfix/build/libs/visibletraders-1.3.2-cartographer-hotfix-1.0.0.jar"
          if [ -f "$jar_path" ]; then
            cp "$jar_path" artifacts/
          fi
          echo "$status" > artifacts/build-exit-code.txt
          exit 0
      - name: Commit build result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts
          git commit -m "[ci artifact] Visible Traders hotfix build result" || exit 0
          git push
